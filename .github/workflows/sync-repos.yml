name: Sync GitHub projects

# Every 6 hours (and on demand) this lists my public repositories tagged with the
# "portfolio" topic and saves them to data/repos.js, which the site shows under
# "More from GitHub". If nothing changed, nothing is committed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-repos.mjs'
      - '.github/workflows/sync-repos.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-repos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch repositories tagged "portfolio"
        run: node scripts/sync-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the list changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain data/repos.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/repos.js
            git commit -m "chore: sync GitHub projects"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
